# ── Docker overrides for Gauge ─────────────────────────────────────
quarkus.http.host=0.0.0.0
quarkus.http.port=8087

# ── API key pepper ─────────────────────────────────────────────────
gauge.api-key.pepper=change-me

# ── Datasource (file-based H2, stored next to the jar) ─────────────
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/gauge;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

gauge.api-key.access=change-me
gauge.auth.admin.username=admin
gauge.auth.admin.password=admin

