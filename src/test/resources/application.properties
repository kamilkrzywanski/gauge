# ── Test profile: in-memory H2, create-drop ───────────────────────
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:gauge_test;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# ── Use random port, bind to all interfaces ────────────────────────
quarkus.http.host=0.0.0.0
quarkus.http.port=8213
quarkus.http.test-port=8213

# ── Security: disable for tests ────────────────────────────────────
quarkus.security.auth.enabled-in-dev-mode=false
quarkus.http.auth.basic=false
quarkus.http.auth.form.enabled=false
quarkus.security.jdbc.enabled=false

# ── API key for tests ─────────────────────────────────────────────
gauge.api-key.access=test-key
gauge.api-key.pepper=test-pepper

# ── Skip admin seeding (table doesn't exist yet at startup) ───────
gauge.auth.seed-on-startup=false
gauge.auth.admin.username=admin
gauge.auth.admin.password=admin
