<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='Create Issue', activePath='/ui/projects', content=~{::#page-content})}">
<body>
<div id="page-content">
    <div id="project-path" class="project-path" style="margin-bottom:8px;">
        <a href="/ui/projects">Projects</a>
    </div>

    <h1 class="page-title">Create Issue</h1>
    <p class="page-subtitle">New issue for <span id="project-name">…</span></p>

    <div class="card" style="margin-bottom:24px;">
        <div class="card-body">
            <form id="create-issue-form" class="stack" style="gap:14px;">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="f-issue-title" placeholder="Issue title" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="f-issue-desc" placeholder="Optional description" rows="4"></textarea>
                </div>
                <div class="form-group" style="max-width:200px;">
                    <label>Priority</label>
                    <select id="f-issue-priority">
                        <option value="NORMAL">Normal</option>
                        <option value="LOW">Low</option>
                        <option value="HIGH">High</option>
                    </select>
                </div>
                <div style="display:flex;align-items:center;gap:12px;">
                    <button type="submit" class="btn btn-primary">Create Issue</button>
                    <a id="cancel-link" href="#" class="btn">Cancel</a>
                </div>
            </form>
            <div id="create-issue-status" class="status-box" style="margin-top:12px;"></div>
        </div>
    </div>

    <script th:inline="javascript">
    var projectId = /*[[${projectId}]]*/ '';

    function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }

    async function init() {
        document.getElementById('cancel-link').href = '/ui/projects/' + projectId;

        try {
            var res = await fetch('/api/projects/' + projectId);
            if (!res.ok) {
                document.getElementById('project-name').textContent = 'unknown project';
                return;
            }
            var p = await res.json();
            document.getElementById('project-name').textContent = esc(p.name || projectId.substring(0,8));

            var ancRes = await fetch('/api/projects/' + projectId + '/ancestors');
            if (ancRes.ok) {
                var ancestors = await ancRes.json();
                ancestors.reverse();
                var pathHtml = '<a href="/ui/projects">Projects</a>';
                ancestors.forEach(function(a) {
                    pathHtml += ' <span class="sep">/</span> ';
                    if (a.id === projectId) {
                        pathHtml += '<a href="/ui/projects/' + esc(a.id) + '">' + esc(a.name || a.id.substring(0,8)) + '</a>';
                    } else {
                        pathHtml += '<a href="/ui/projects/' + esc(a.id) + '">' + esc(a.name || a.id.substring(0,8)) + '</a>';
                    }
                });
                pathHtml += ' <span class="sep">/</span> <strong>New Issue</strong>';
                document.getElementById('project-path').innerHTML = pathHtml;
            }
        } catch(e) {
            document.getElementById('project-name').textContent = 'error loading project';
        }
    }

    document.getElementById('create-issue-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        var statusEl = document.getElementById('create-issue-status');
        statusEl.textContent = 'Creating…';
        try {
            var body = {
                title: document.getElementById('f-issue-title').value,
                description: document.getElementById('f-issue-desc').value || null,
                priority: document.getElementById('f-issue-priority').value
            };
            var res = await fetch('/api/projects/' + projectId + '/issues', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            if (res.ok) {
                var issue = await res.json();
                statusEl.innerHTML = '<span class="pill pill-done">Created!</span> Redirecting…';
                setTimeout(function() {
                    window.location.href = '/ui/issues/' + issue.id;
                }, 600);
            } else {
                statusEl.innerHTML = '<span class="pill pill-failed">Error creating issue</span>';
            }
        } catch(e) {
            statusEl.innerHTML = '<span class="pill pill-failed">Request failed</span>';
        }
    });

    init();
    </script>

    <style>
    .project-path {
        font-size: 15px;
        color: var(--muted);
    }
    .project-path a {
        color: var(--accent);
        font-weight: 500;
    }
    .project-path .sep {
        color: var(--muted);
        font-weight: 700;
        margin: 0 4px;
    }
    .project-path strong {
        color: var(--text);
    }
    </style>
</div>
</body>
</html>
